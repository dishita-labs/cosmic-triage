# Fields that must never cross into Snapshot(t) (ARCHITECTURE §3.3 step 1, §14.1).
# Exact names are dropped from every raw record before any processing; `prefixes` match by prefix.
# Final-history aggregates are dropped and recomputed from data <= t.
# v1.1 (Review-03, §6.4): per-alert history fields carried by an alert packet are time-honest in *alert rows* with
# jd <= t and are allowed for the listed source only (`per_alert_allow`). The same names stay denied everywhere else
# (e.g. object-level `jdstarthist`/`ndethist` injected into ALeRCE records are still scrubbed).
version: "1.1"
exact:
  - type
  - redshift
  - class
  - classifier
  - probability
  - probabilities
  - ndethist
  - ncovhist
  - mjdstarthist
  - mjdendhist
  - jdstarthist
  - jdendhist
  - ndet
  - lastmjd
  - deltajd
  - g_r_max
  - g_r_max_corr
  - g_r_mean
  - g_r_mean_corr
  - meanra
  - meandec
  - sigmara
  - sigmadec
  - lc_classifier
  - ncand
  - jdmax
  - maggmin
  - magrmin
  - maggmax
  - magrmax
  - IAUID
  - savedate
prefixes:
  - peak
  - "v:"           # Fink object-level (final) aggregates
  - "d:lc_features"
per_alert_allow:
  fink: ["i:jdstarthist", "i:ndethist"]
