II: ["SN II", "SN IIP", "SN IIL", "SN IIn", "SN II-pec", "SN IIn-pec"]
Ibc: ["SN Ib", "SN Ic", "SN Ic-BL", "SN Ib/c", "SN IIb", "SN Ibn", "SN Icn", "SN Ib-pec", "SN Ic-pec", "SN Ib-Ca-rich", "SN Ca-rich", "SN Ibn/Icn"]
other_luminous: ["SLSN-I", "SLSN-II", "SLSN-R", "TDE", "TDE-H", "TDE-He", "TDE-H-He", "TDE-featureless"]
contaminant: ["AGN", "AGN?", "CV", "CV?", "nova", "LBV", "star", "varstar", "bogus", "Galactic", "QSO", "blazar", "YSO", "M dwarf", "ILRT", "LRN"]
