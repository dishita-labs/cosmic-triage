# BTS `type` string -> coarse class K (ARCHITECTURE §1.2). Unlisted types are `unmapped` and excluded from
# class-level metrics (counted and reported). IIb/Ibn/Icn/Ca-rich are grouped with stripped-envelope (Ibc).
version: "1.0"
